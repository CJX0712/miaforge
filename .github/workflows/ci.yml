name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ruff 版本钉死：默认规则集会随版本漂移，不钉则同一份代码 lint 结论不可复现
          pip install pytest ruff==0.16.10

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: pytest -q

      - name: Demo smoke (gate + determinism)
        run: python cli.py demo --out examples/benchmark_ci.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets / private keys
        run: |
          echo "scanning for private keys and tokens..."
          ! grep -rEn "-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----" --include="*.py" --include="*.txt" --include="*.json" . || echo "FOUND_PRIVATE_KEY"
          ! grep -rEn "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,})" --include="*.py" --include="*.md" --include="*.json" . || echo "FOUND_TOKEN"
          echo "secret scan done (no findings => exit 0)"
